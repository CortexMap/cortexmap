services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - infra-net

  cortexmap-be:
    image: 285560394698.dkr.ecr.us-east-1.amazonaws.com/capstone26t217/fetcher:latest
    container_name: cortexmap-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      FETCHER_HTTP_ADDR: ${FETCHER_HTTP_ADDR:-0.0.0.0:8080}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fetcher-be/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infra-net

  brainatlas-be:
    image: 285560394698.dkr.ecr.us-east-1.amazonaws.com/capstone26t217/brainatlas-be:latest
    container_name: brainatlas-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      BRAINATLAS_HTTP_ADDR: ${BRAINATLAS_HTTP_ADDR:-0.0.0.0:8081}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/brainatlas-be/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infra-net

  orch:
    image: 285560394698.dkr.ecr.us-east-1.amazonaws.com/capstone26t217/orch:latest
    container_name: orch
    restart: unless-stopped
    depends_on:
      cortexmap-be:
        condition: service_healthy
      brainatlas-be:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ".env.orch"
    environment:
      # Hardcoded network addresses — always correct on this Docker network.
      # DATABASE_URL and CORS_ORIGIN intentionally omitted here so they come
      # exclusively from .env.orch rather than being overridden by the
      # project-level .env via ${VAR} substitution.
      FETCHER_HTTP_ADDR: http://cortexmap-be:8080
      BRAINATLAS_HTTP_ADDR: http://brainatlas-be:8081
      ORCH_HTTP_ADDR: 0.0.0.0:8082
      REDIS_URL: redis://redis:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/orch/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infra-net

  brainatlas-fe:
    image: 285560394698.dkr.ecr.us-east-1.amazonaws.com/capstone26t217/brainatlas-fe:latest
    container_name: brainatlas-fe
    restart: unless-stopped
    depends_on:
      orch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - infra-net

networks:
  infra-net:
    external: true
