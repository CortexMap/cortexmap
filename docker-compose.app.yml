services:
  cortexmap-be:
    image: 285560394698.dkr.ecr.us-east-1.amazonaws.com/capstone26t217/fetcher:latest
    container_name: cortexmap-be
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      HTTP_ADDR: ${HTTP_ADDR:-0.0.0.0:8080}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - infra-net

networks:
  infra-net:
    external: true
