services:
  cortexmap-be:
    image: 285560394698.dkr.ecr.us-east-1.amazonaws.com/capstone26t217/fetcher:latest
    container_name: cortexmap-be
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      HTTP_ADDR: ${HTTP_ADDR:-0.0.0.0:8080}
    networks:
      - cortexmap-network

networks:
  cortexmap-network:
    external: true
