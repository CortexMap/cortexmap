syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

package com.cortexmap;

message  RegionID {
  int32 id = 1;
}

message Acronym {
  string acronym = 1;
}
message Uuid {
  string value = 1;
}

// Request message for searching a specific brain region entry
// List of IDs can be fetched using ListBrainRegions RPC
message SearchBrainRegionRequest {
  Uuid id = 1;
}

// When the region information is updated overtime,
// there will be multiple entries for the same region,
// and this message will be used to return all the entries for a specific region.
message BrainRegionList {
  repeated BrainRegionEntry entries = 1;
}

message BrainRegionEntry {
  RegionID region_id = 1;
  string name        = 2;
  string acronym     = 3;
  string summary     = 4;
  string created_at  = 10; // ISO 8601 UTC timestamp, e.g. "2026-02-14T12:00:00Z"
}

message SearchBrainRegionResponse {
  repeated BrainRegionEntry entries = 1;
}

enum Status {
  FETCHER_QUEUE = 0;
  FETCHING = 1;
  INDEX_QUEUE = 2;
  INDEXING = 3;
  GENERATING = 4;
  DONE = 5;
}

message RGB {
  int32 r = 1;
  int32 g = 2;
  int32 b = 3;
}

message RegionMapping {
  Uuid id = 1;

  // Data defined in the excel sheet
  RegionID region_id = 2;
  Status status = 3;
  RGB color = 4;
  int32 structure_order = 5;
  RegionID parent_region_id = 6;
  Acronym acronym = 7;
  Acronym parent_acronym = 8;
}

message BrainRegionListResponse {
  repeated RegionMapping regions = 1;
}

message StatusRequest {
  Uuid id = 1;
}

message StatusResponse {
  Status status = 1;
}

// Called by orch when a fetch task completes.
// Brainatlas will chunk, embed, and summarize the files at the given S3 keys,
// then append a new row to region_summary.
message ProcessRegionRequest {
  // UUID from region_mapping — identifies which region these files belong to.
  Uuid region_id       = 1;
  // S3 object keys for the files to process (PDF, abstract, etc.).
  repeated string s3_keys = 2;
  // UUID of the batch that triggered this processing
  Uuid batch_id = 3;
  // Optional: LLM model for chat/summarization (e.g., "openai/gpt-4o-mini").
  // If empty, falls back to CHAT_MODEL env var or default.
  optional string chat_model = 4;
  // Optional: LLM model for embeddings (e.g., "text-embedding-3-small").
  // If empty, falls back to EMBEDDING_MODEL env var or default.
  optional string embedding_model = 5;
  // Paper metadata for source attribution
  repeated PaperMetadata paper_metadata = 6;
  // If true, only chunk and embed — skip RAG summarization.
  // Used by the background pipeline to grow the knowledge base without generating summaries.
  optional bool skip_summarization = 7;
  // Optional opaque correlation id for LLM cost attribution. Typically set by
  // orch as `batch:<batch_uuid>` so the persisted usage rows can be joined
  // back to the triggering batch/region.
  optional string correlation_id = 8;
}

// Metadata for a single paper fetched from PubMed
message PaperMetadata {
  string s3_key = 1;                    // S3 key that matches an entry in s3_keys
  optional string pmc_id = 2;           // PubMed Central ID (e.g., "PMC12345")
  optional string uid = 3;              // PubMed UID for linking
  optional string query = 4;            // The PubMed query that found this paper
}

message ProcessRegionResponse {
  Uuid   region_id = 1;
  // Human-readable summary of what was written (e.g. "stored 1 summary for region 42").
  string detail    = 2;
  // UUID of the region_summary row that was created or updated. Present whenever
  // the server successfully persists a summary (RAG or knowledge-only paths).
  optional Uuid summary_id = 3;
}

// Called by orch when a region has zero NCBI search results. Generates a
// structured summary from the LLM's own general/textbook knowledge (no
// retrieved papers, no chunk citations). Guarantees that every region
// ends up with at least one summary.
message ProcessNoPapersRequest {
  // UUID from region_mapping — identifies the region.
  Uuid region_id = 1;
  // UUID of the batch that triggered this processing. May be absent; the
  // server will generate a fresh one if not supplied.
  Uuid batch_id = 2;
  // Optional: LLM model for chat/summarization (e.g. "openai/gpt-4o-mini").
  optional string chat_model = 3;
  // Optional opaque correlation id for LLM cost attribution. Typical value
  // is `batch:<batch_uuid>`.
  optional string correlation_id = 4;
}

message ProcessNoPapersResponse {
  Uuid region_id = 1;
  // Human-readable detail (e.g. "stored knowledge-only summary for region 49").
  string detail = 2;
}

// Called by orch to generate search queries for a brain region using LLM.
// This allows orch to get intelligent, context-aware queries instead of using templates.
message GenerateQueriesRequest {
  string region_name = 1;  // Name of the brain region (e.g., "hippocampus")
  uint32 count = 2;        // Number of queries to generate (typically 3-5)
  // Optional opaque correlation id for LLM cost attribution. Typically set by
  // orch as `region:<region_id>` so the persisted usage rows can be joined
  // back to the triggering region.
  optional string correlation_id = 3;
}

message GenerateQueriesResponse {
  repeated string queries = 1;  // LLM-generated search queries
}

// Request to resolve a chunk ID to its source file and character range
message GetChunkSourceRequest {
  string chunk_id = 1;  // UUID of the brain_region_embedding row
}

// Full source details for a chunk
message ChunkSourceResponse {
  string chunk_id = 1;
  string chunk_text = 2;
  optional string source_s3_key = 3;
  optional string source_pmc_id = 4;
  optional string source_uid = 5;
  optional string source_query = 6;
  optional int32 char_start = 7;
  optional int32 char_end = 8;
}

service BrainRegionService {
  // Search for a specific brain region entry by query
  rpc SearchBrainRegion(SearchBrainRegionRequest) returns (SearchBrainRegionResponse) {
    option (google.api.http) = {
      post: "/api/search"
      body: "*"
    };
  }

  // List all brain region entries, which can be used to fetch the list of IDs for searching specific entries.
  rpc ListBrainRegions(google.protobuf.Empty) returns (BrainRegionListResponse) {
    option (google.api.http) = {
      get: "/api/list"
    };
  }

  // DEPRECATED: pipeline status is owned by orch. Will be removed in a future version.
  // Check the status of a specific brain region entry by ID.
  rpc Status(StatusRequest) returns (StatusResponse) {
    option (google.api.http) = {
      post: "/api/status"
      body: "*"
    };
  }

  // Called by orch once a fetch task completes.
  // Triggers chunking, embedding, and summary generation for the given S3 files,
  // then persists the result to region_summary.
  rpc ProcessRegion(ProcessRegionRequest) returns (ProcessRegionResponse) {
    option (google.api.http) = {
      post: "/api/process"
      body: "*"
    };
  }

  // Called by orch when a region has zero NCBI search results.
  // Generates a knowledge-only summary (no chunk citations) so every
  // region ends up with at least one summary.
  rpc ProcessRegionNoPapers(ProcessNoPapersRequest) returns (ProcessNoPapersResponse) {
    option (google.api.http) = {
      post: "/api/process-no-papers"
      body: "*"
    };
  }

  // Generate search queries for a brain region using LLM.
  // Called by orch when creating a new batch to get intelligent queries
  // instead of using hardcoded templates.
  rpc GenerateQueries(GenerateQueriesRequest) returns (GenerateQueriesResponse) {
    option (google.api.http) = {
      post: "/api/generate-queries"
      body: "*"
    };
  }

  // Resolve a chunk UUID to its full source details (file, character range, etc.).
  // Called by orch on behalf of the client when they click a citation.
  rpc GetChunkSource(GetChunkSourceRequest) returns (ChunkSourceResponse) {
    option (google.api.http) = {
      get: "/api/chunks/{chunk_id}/source"
    };
  }
}
