[package]
name = "cortexmap-fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror.workspace = true
serde.workspace = true
reqwest.workspace = true
serde_json.workspace = true
futures.workspace = true
bytes.workspace = true
tokio = { version = "1.48.0", features = [] }

cortexmap-core.workspace = true
cortexmap-infra.workspace = true
uuid = { version = "1.18.1", features = ["v4"] }
tracing = "0.1.41"
backon = { version = "1.3.0", features = ["tokio-sleep"] }
fastrand = "2"

[dev-dependencies]
# it's bad idea to use std-infra for tests..
std-infra = { path = "../std-infra" }
diesel = { version = "2.2.9", features = ["postgres"] }
futures = "0.3"
serial_test = "3"
tokio = { version = "1.48.0", features = ["macros", "rt"] }
