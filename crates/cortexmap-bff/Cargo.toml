[package]
name = "cortexmap-bff"
version = "0.1.0"
edition = "2021"
description = "Backend-for-Frontend: HTTP REST API that proxies to Python BrainRegionService via gRPC"

[dependencies]
# gRPC client
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }

# HTTP server
axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

[build-dependencies]
tonic-build = "0.12"
