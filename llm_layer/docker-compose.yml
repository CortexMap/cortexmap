services:
  postgres:
    image: postgres:16-alpine
    container_name: llmlayer-postgres
    environment:
      POSTGRES_USER: llmlayer
      POSTGRES_PASSWORD: llmlayer_dev
      POSTGRES_DB: llmlayer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmlayer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llmlayer-network

  # PostgreSQL visualization tools
  adminer:
    image: adminer:latest
    container_name: llmlayer-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: 10.2.0.251:5432
    networks:
      - llmlayer-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: llmlayer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cortexmap.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - llmlayer-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  llmlayer-network:
    driver: bridge