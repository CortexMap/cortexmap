syntax = "proto3";

// Represents a single brain region with anatomical and clinical information
message BrainRegion {
  string id = 1;                          // Unique identifier
  string name = 2;                        // Region name (e.g., "Hippocampus")
  Location location = 3;                  // Anatomical location
  FunctionAndDiseases function_diseases = 4;  // Functional description and associated diseases
}

// Anatomical location information
message Location {
  string hemisphere = 1;              // "Left", "Right", or "Bilateral"
  string lobe = 2;                   // "Frontal", "Parietal", "Temporal", "Occipital", etc.
  string anatomical_region = 3;      // More specific region (optional)
}

// Function description and associated diseases
message FunctionAndDiseases {
  string function_description = 1;   // What this region does
  string disease_description = 2;  // List of related diseases
}

// Service definition
service BrainRegionService {
  // Fetch a single brain region by ID
  rpc GetBrainRegion(GetBrainRegionRequest) returns (BrainRegion);

  // Fetch all brain regions
  rpc ListBrainRegions(ListBrainRegionsRequest) returns (ListBrainRegionsResponse);

  // Stream brain regions (useful for large datasets)
  rpc StreamBrainRegions(StreamBrainRegionsRequest) returns (stream BrainRegion);
}

message GetBrainRegionRequest {
  string id = 1;
}

message ListBrainRegionsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string filter = 3;  // Optional filter by name or lobe
}
message ListBrainRegionsResponse {
  repeated BrainRegion regions = 1;
  int32 total_count = 2;
}
message StreamBrainRegionsRequest {
  string filter = 1;  // Optional
}