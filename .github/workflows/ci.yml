name: ci
env:
  RUSTFLAGS: '-Dwarnings'
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
  push:
    branches:
    - main
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Install protoc and lcov
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lcov
    - name: Start Test Infrastructure
      run: docker compose -f docker-compose.test.yml up -d --wait postgres-test redis-test minio-test && docker compose -f docker-compose.test.yml run --rm minio-setup
    - name: Run Database Migrations
      run: |-
        export PGPASSWORD=test_password
        PSQL="psql -h localhost -p 5433 -U test_user -d test_db"
        $PSQL -v ON_ERROR_STOP=1 -c "
        CREATE TABLE IF NOT EXISTS region_mapping (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            region_id INTEGER NOT NULL UNIQUE,
            name VARCHAR(255) NOT NULL UNIQUE,
            acronym VARCHAR(50),
            red INTEGER,
            green INTEGER,
            blue INTEGER,
            structure_order INTEGER,
            parent_region_id INTEGER,
            parent_acronym VARCHAR(50),
            created_at TIMESTAMP
        );
        CREATE TABLE IF NOT EXISTS region_summary (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            region_id INTEGER NOT NULL UNIQUE,
            name VARCHAR(255) NOT NULL UNIQUE,
            acronym VARCHAR(50),
            summary TEXT,
            created_at TIMESTAMP
        );"
        for f in fetcher-be/migrations/*/up.sql; do
          echo "Running migration: $f"
          $PSQL -f "$f" || true
        done
        for f in orch/migrations/*/up.sql; do
          echo "Running migration: $f"
          $PSQL -f "$f" || true
        done
        for f in brainatlas-be/migrations/*/up.sql; do
          echo "Running migration: $f"
          $PSQL -f "$f" || true
        done
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c
      with:
        toolchain: nightly
        components: llvm-tools-preview
        cache: 'true'
        cache-workspaces: |-
          fetcher-be -> fetcher-be/target
          brainatlas-be -> brainatlas-be/target
          orch -> orch/target
    - name: Cache cargo-llvm-cov
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cargo/bin/cargo-llvm-cov
        key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-llvm-cov-
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov || true
    - name: Generate coverage (main branch or expensive)
      if: '${{ github.ref == ''refs/heads/main'' || contains(github.event.pull_request.labels.*.name, ''ci: expensive'') }}'
      run: (cd fetcher-be && cargo +nightly llvm-cov --release --all-features --workspace --lcov --output-path ../lcov-fetcher.info) && (cd brainatlas-be && cargo +nightly llvm-cov --release --all-features --workspace --lcov --output-path ../lcov-brainatlas.info) && (cd orch && cargo +nightly llvm-cov --release --all-features --workspace --lcov --output-path ../lcov-orch.info)
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5433/test_db
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5433/test_db
        RUN_INTEGRATION_TESTS: '1'
        REDIS_URL: redis://127.0.0.1:6380
        S3_ENDPOINT: http://localhost:9000
        S3_ACCESS_KEY: test_access_key
        S3_SECRET_KEY: test_secret_key
        S3_BUCKET: test-bucket
    - name: Generate coverage (fast)
      if: '${{ github.ref != ''refs/heads/main'' && !contains(github.event.pull_request.labels.*.name, ''ci: expensive'') }}'
      run: (cd fetcher-be && cargo +nightly llvm-cov --workspace --lcov --output-path ../lcov-fetcher.info) && (cd brainatlas-be && cargo +nightly llvm-cov --workspace --lcov --output-path ../lcov-brainatlas.info) && (cd orch && cargo +nightly llvm-cov --workspace --lcov --output-path ../lcov-orch.info)
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5433/test_db
        TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5433/test_db
        RUN_INTEGRATION_TESTS: '1'
        REDIS_URL: redis://127.0.0.1:6380
        S3_ENDPOINT: http://localhost:9000
        S3_ACCESS_KEY: test_access_key
        S3_SECRET_KEY: test_secret_key
        S3_BUCKET: test-bucket
    - name: Merge coverage reports
      run: lcov --add-tracefile lcov-fetcher.info --add-tracefile lcov-brainatlas.info --add-tracefile lcov-orch.info --output-file lcov.info
    - name: Upload Coverage to Codecov
      uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea
      with:
        action: codecov/codecov-action@v4
        attempt_limit: '3'
        attempt_delay: '10000'
        with: |-
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
