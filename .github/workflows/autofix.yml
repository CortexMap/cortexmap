name: autofix.ci
env:
  RUSTFLAGS: '-Dwarnings'
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
  push:
    branches:
    - main
jobs:
  lint:
    name: Lint Fix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c
      with:
        toolchain: nightly
        components: clippy, rustfmt
        cache: 'true'
        cache-workspaces: |-
          fetcher-be -> fetcher-be/target
          brainatlas-be -> brainatlas-be/target
          orch -> orch/target
          evals-be -> evals-be/target
    - name: Cargo Fmt
      run: (cd fetcher-be && cargo +nightly fmt --all) && (cd brainatlas-be && cargo +nightly fmt --all) && (cd orch && cargo +nightly fmt --all) && (cd evals-be && cargo +nightly fmt --all)
    - name: Cargo Clippy
      run: (cd fetcher-be && cargo +nightly clippy --all-features --workspace --fix --allow-dirty -- -D warnings) && (cd brainatlas-be && cargo +nightly clippy --all-features --workspace --fix --allow-dirty -- -D warnings) && (cd orch && cargo +nightly clippy --all-features --workspace --fix --allow-dirty -- -D warnings) && (cd evals-be && cargo +nightly clippy --all-features --workspace --fix --allow-dirty -- -D warnings)
    - name: Autofix
      uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8
concurrency:
  group: autofix-${{github.ref}}
  cancel-in-progress: false
