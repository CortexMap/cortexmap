[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
domain = { path = "crates/domain" }
api = { path = "crates/api" }
rpc-types = { path = "crates/rpc-types" }
services = { path = "crates/services" }
app = { path = "crates/app" }
infra = { path = "crates/infra" }

prost = "0.14.3"
prost-types = "0.14.3"
tonic = "0.14.4"
tonic-prost = "0.14.4"
tonic-prost-build = "0.14.4"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2.0"
diesel = { version = "2.3.2", features = ["postgres", "r2d2", "chrono", "uuid"] }
deadpool-diesel = { version = "0.6", features = ["postgres"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
pgvector = { version = "0.4", features = ["diesel"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
aws-sdk-s3 = "1.0"
aws-config = "1.0"
sha2 = "0.10"
schemars = "0.8"
